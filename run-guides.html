<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Run Guides – LRTops.ca</title>

    <link rel="stylesheet" href="css/main.css">

    <style>
        /* Shared box styling */
        .run-box {
            padding: 18px 20px;
            border-radius: 6px;
            margin-top: 25px;
        }

        .run-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .run-list {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }

        .run-list li {
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-weight: bold;
        }

        .run-link {
            text-decoration: none;
            font-weight: bold;
        }

        .run-link:hover {
            text-decoration: underline;
        }

        /* ⭐ LINE 5 COLORS */
        .line5-box {
            background: #ffe5e5;
            border-left: 5px solid #cc0000;
        }

        .line5-title {
            color: #cc0000;
        }

        .line5-list li {
            background: #f7d4d4;
            color: #cc0000;
        }

        .line5-link {
            color: #cc0000;
        }

        /* ⭐ LINE 6 COLORS */
        .line6-box {
            background: #e5f0ff;
            border-left: 5px solid #0055cc;
        }

        .line6-title {
            color: #0055cc;
        }

        .line6-list li {
            background: #d6e6ff;
            color: #0055cc;
        }

        .line6-link {
            color: #0055cc;
        }

        /* ⭐ DARK MODE FIXES */
        body.dark-mode .line5-box {
            background: #442222;
            border-left-color: #ff6666;
        }

        body.dark-mode .line5-list li {
            background: #663333;
            color: #ff9999;
        }

        body.dark-mode .line5-link {
            color: #ff9999;
        }

        body.dark-mode .line6-box {
            background: #1f2f44;
            border-left-color: #66a3ff;
        }

        body.dark-mode .line6-list li {
            background: #2b3f5c;
            color: #99c2ff;
        }

        body.dark-mode .line6-link {
            color: #99c2ff;
        }
    </style>
</head>

<body>

<div data-include="header.html"></div>

<main class="content">

        Run Guides for the current board period:

        <ul class="run-list line5-list">
            <li>
                <a class="run-link line5-link" href="run-guides/2026-09-06-Line5_Sunday_Runguide.pdf" target="_blank">
                    Line 5 — Sunday
                </a>
            </li>

            <li>
                <a class="run-link line5-link" href="run-guides/2026-09-06-Line5_Daily_Runguide.pdf" target="_blank">

            </li>

            <li>

                    Line 5 — Saturday
                </a>
            </li>
        </ul>
    </div>

    <!-- ⭐ LINE 6 BOX -->

        <div class="run-title line6-title">Line 6 – Run Guides</div>

        <ul class="run-list line6-list">

                    Line 6 — Sunday
                </a>
            </li>

            <li>
                <a class="run-link line6-link" href="run-guides/2026-09-06-Line6_Daily_Runguide.pdf" target="_blank">
                    Line 6 — Daily (Mon–Fri)
                </a>
            </li>

            <li>
                <a class="run-link line6-link" href="run-guides/2026-09-06-Line6_Saturday_Runguide.pdf" target="_blank">
                    Line 6 — Saturday

        </ul>
    </div>

</main>

<div data-include="footer.html"></div>

<script src="js/include.js"></script>

</body>
</html>
