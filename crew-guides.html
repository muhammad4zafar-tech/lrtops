    <link rel="stylesheet" href="css/main.css">

    <style>
        .board-section {
            margin-bottom: 40px;
        }

        .board-section h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--ttc-red);
            padding-bottom: 5px;
        }

        .line-heading {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .line5-heading {
            color: #7A0010; /* TTC burgundy */
        }

        .line6-heading {
            color: #1e4fa8; /* Finch West LRT blue */
        }

        .special-heading {
            color: #008000; /* Green */
        }

        .sac-heading {
            color: #8A2BE2; /* Purple */
        }

        .crew-list {
            list-style: none;
            padding: 0;
        }

        .crew-list li {
            margin-bottom: 10px;
        }

        .crew-link {
            background: #f5f5f5;
            padding: 12px 15px;
            border-radius: 6px;
            display: block;
            text-decoration: none;
            font-weight: bold;
            color: var(--ttc-red);
        }

        .crew-link:hover {
            background: #e0e0e0;
        }

        body.dark-mode .crew-link {
            background: #333;
            color: #fff;
        }

        body.dark-mode .crew-link:hover {
            background: #444;
        }
    </style>
</head>
